const isWall=()=>matchMedia('(min-aspect-ratio:5/4)').matches;
// Midnight today. Nothing is ever ticked off: an item stands all day and then
// stops being listed once the day is over, so this is the only thing that
// retires anything.
const startOfToday=()=>{const n=new Date();n.setHours(0,0,0,0);return n};

function render(){
  agL.innerHTML='';
  const floor=+startOfToday();
  const sorted=[...ITEMS,...repItems()]
    .filter(it=>+it.when>=floor)
    .sort((a,b)=>a.when-b.when);
  // group by calendar day, skipping empty days automatically (only days with items exist)
  const groups={};
  sorted.forEach(it=>{
    const k=new Date(it.when); k.setHours(0,0,0,0);
    (groups[k.getTime()]=groups[k.getTime()]||[]).push(it);
  });
  let keys=Object.keys(groups).sort((a,b)=>a-b);
  /* Everything the server sent, on every screen. No day-count clip.

     There were two earlier versions of this and both were wrong. The first cut
     every screen at today+6, which is what made Google look like it stopped on
     Thursday. The second kept that cut for the wall on the theory that a panel
     which cannot scroll should only be shown what fits — but "what fits" is the
     agenda box's job, not this function's. The box already fades at its bottom
     edge, so a longer list simply runs under the fade and the wall fills.

     365 rather than a real horizon: build_agenda() decides how far ahead to
     send, and duplicating that number here is how the two drift apart. */
  const horizon=(()=>{const n=startOfToday();n.setDate(n.getDate()+365);return +n})();
  keys=keys.filter(k=>+k<=horizon);
  keys.forEach(k=>{
    const dt=new Date(+k);
    const h=document.createElement('div');h.className='dayh';
    h.innerHTML=dayLabel(dt)+`<small>${dt.toLocaleDateString([],{month:'short',day:'numeric'})}</small>`;
    agL.appendChild(h);
    const dayOffset=Math.round((+k-(+startOfToday()))/DAY);
    groups[k].forEach(it=>{
      const r=document.createElement('div');
      r.className='row'+(it.kind==='task'?' task':'')+(it.now?' now-ev':'');
      // 23:59 is the "no particular time" sentinel. The placeholder used to be
      // an em dash, which broke the house rule in the single most-read element
      // on the wall: every homework row and every hair wash carries it. It is a
      // middle dot now. test_agenda.py never caught it because that suite only
      // scans app_jarvis.py, and this string lives here.
      const time=it.when.getHours()===23&&it.when.getMinutes()===59?'·':it.when.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).toLowerCase().replace(' ','');
      // Nothing is ticked off here. An item stands until its day is over and
      // then stops being listed, so there is no done state and no tap target —
      // a wall you cannot touch had no way to use one anyway.
      const sub=it.s?`<div class="s">${it.s}</div>`:'';
      r.innerHTML=`<span class="t">${time}</span><span class="rail"></span><span><div class="n">${it.imp?'<span class="imp"><svg class="ico star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2.6l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 16.7 6.4 19.8l1.3-6.3L3 9.2l6.3-.7z"/></svg></span>':''}${it.n}</div>${sub}</span>`;
      agL.appendChild(r);
    });
  });
  // No add rows and no trailing empty day. A day only appears if something is
  // actually on it, so the list is what is happening rather than a calendar
  // grid with gaps in it. Adding happens in Settings > Homework.
  const tasks=ITEMS.filter(i=>i.kind==='task'&&+i.when>=+startOfToday()).length;
  document.getElementById('agCount').textContent=tasks+(tasks===1?' task':' tasks');
  jarvisRender();
}

function parseAdd(str){
  let txt=str.trim(), when=new Date(), hasTime=false;
  // "!" anywhere marks important; quiz/test words are always important
  let imp=false;
  if(txt.includes('!')){imp=true;txt=txt.replace(/!/g,'').trim()}
  if(/\b(quiz|test|exam|midterm|final)\b/i.test(txt))imp=true;
  // time: 5pm / 5:30pm / 17:00
  const tm=txt.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
  if(tm&&(tm[3]||tm[2])){
    let H=+tm[1],M=+(tm[2]||0);
    if(tm[3]){if(/pm/i.test(tm[3])&&H<12)H+=12;if(/am/i.test(tm[3])&&H===12)H=0;}
    when.setHours(H,M,0,0);hasTime=true;
    txt=txt.replace(tm[0],'').trim();
  }
  // day word
  const dm=txt.match(/\b(today|tomorrow|sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(day)?\b/i);
  if(dm){
    const w=dm[1].toLowerCase();
    if(w==='tomorrow')when=new Date(when.getTime()+DAY);
    else if(w!=='today'&&w in DAYS){
      let add=(DAYS[w]-when.getDay()+7)%7; if(add===0)add=7;
      when=new Date(when.getTime()+add*DAY);
    }
    txt=txt.replace(dm[0],'').trim();
  }
  if(!hasTime)when.setHours(23,59,0,0);
  return {when,n:txt.replace(/\s+/g,' ')||'Untitled task',s:'',kind:'task',done:false,imp};
}
/* ── JARVIS: a briefing that follows the day ─────────────────────────
   Morning is the day ahead — weather, what to wear, when to leave.
   Afternoon is what's next. Evening closes the day out. Night is sleep:
   the debt number only appears when it's actionable, not at noon.
   ★ bullets underneath hold the big stuff — tests, quizzes, interviews.
   Real build: weather from Open-Meteo, sleep debt from the Oura API,
   pushes over ntfy. Here the weather and sleep numbers are synthetic;
   everything scheduled is read live from the agenda. */
function fmtT(dt){return dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).toLowerCase().replace(' ','')}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function hr12(h){return h===0?'12am':h<12?h+'am':h===12?'noon':(h-12)+'pm'}
const WXDAYS=[ // synthetic day-weather, stable per date: hi, lo, wind mph, rain window [from,to], sunset hour
 {hi:88,lo:72,wind:6, rain:null,    sunset:20},
 {hi:84,lo:71,wind:9, rain:null,    sunset:20},
 {hi:78,lo:66,wind:16,rain:[14,18], sunset:20},
 {hi:75,lo:63,wind:12,rain:[9,17],  sunset:20},
 {hi:91,lo:74,wind:5, rain:[16,19], sunset:20}
];
function wx(){const d=new Date();return WXDAYS[(d.getDate()+d.getMonth())%WXDAYS.length]}
// rough temp for right now: coldest around 6am, peak around 4pm
function tempNow(w,h){
  const t=Math.cos((h-16)/24*2*Math.PI);
  return Math.round(w.lo+(w.hi-w.lo)*((t+1)/2));
}
/* Oura. Real on the Pi (get_sleep / sleep_debt); synthetic in this demo.
   Stored as minutes so it can be formatted and done arithmetic on, rather than
   as the string "6h40", which read as a part number. */
const SLEEP_LAST_MIN=400, SLEEP_DEBT_MIN=100, SLEEP_BEST=true;
const fmtDur=m=>{const h=Math.floor(m/60),r=Math.round(m%60);
  return h&&r?`${h}h ${r}m`:h?`${h}h`:`${r}m`};

/* A bedtime worth suggesting has to account for the whole morning, not just
   the sleep: eight hours, then getting ready, then getting there. Working back
   from the alarm is what makes the number wrong by an hour. */
const SLEEP_TARGET_H=8, GET_READY_MIN=30, TRAVEL_MIN=20;
/* With nothing scheduled he still surfaces around half nine. */
const DEFAULT_WAKE_H=9, DEFAULT_WAKE_M=30;
/* Room sensor, and what he normally keeps it at, so a reading can be
   compared rather than just stated. Real values on the Pi. */
const ROOM_TEMP=72.4, ROOM_USUAL=72;
const bedtimeFor=ev=>new Date(
  ev.when - (TRAVEL_MIN+GET_READY_MIN)*60000 - SLEEP_TARGET_H*3600000);
/* Habits it has actually noticed. On the Pi these come from /api/patterns and
   the daily history rows. */
const WATER_STREAK=4, WATER_ON_PACE=true;

/* "ELEE 4230 quiz's 3 days out" is wrong — you cannot contract onto a sibilant.
   Names ending in s, z, x, ch or sh take a full "is". */
function nameIs(n){
  return /(s|z|x|ch|sh)$/i.test(String(n).trim()) ? n+' is' : n+"'s";
}

/* A clause, so it can join the sentence in front of it rather than sitting
   next to it as its own clipped fragment. */
function wearClause(w){
  if(w.hi>=85)return "so it'll be a warm one";
  if(w.hi>=70)return 'so short sleeves is fine';
  if(w.hi>=55)return "so it's worth a layer";
  return "so it's a jacket day";
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function jarvisRender(){
  const now=new Date(),h=now.getHours();
  /* When the Pi is answering, the server writes the briefing — it has the Oura
     numbers, the real sleep debt and the whole agenda, none of which this page
     can see. The synthetic version below is what the portfolio demo runs on. */
  if(LIVE.on&&LIVE.brief&&LIVE.brief.lines&&LIVE.brief.lines.length){
    const bullets=document.getElementById('jarvis-bullets');
    document.getElementById('jarvis-output').innerHTML=
      LIVE.brief.lines.map((l,i)=>`<div class="jl${i===0?' lead':''}${
        /\d+\s*(out|outside|°)/.test(l)?' wx':''}">${esc(l)}</div>`).join('');
    const imp=[...ITEMS].filter(i=>i.imp&&i.when>now).sort((a,b)=>a.when-b.when).slice(0,2);
    bullets.innerHTML=imp.map(i=>
      `<div class="jb"><span class="st"><svg class="ico star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2.6l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 16.7 6.4 19.8l1.3-6.3L3 9.2l6.3-.7z"/></svg></span><b>${esc(i.n)}</b>`+
      `<span class="when">${i.when.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})} · ${fmtT(i.when)}</span></div>`).join('');
    bullets.style.display=imp.length?'':'none';
    return;
  }
  const seed=now.getFullYear()+now.getMonth()*31+now.getDate()*7+h;
  const pick=(arr,salt)=>arr[(seed+salt)%arr.length];
  const all=[...ITEMS,...repItems()].sort((a,b)=>a.when-b.when);
  const today=all.filter(it=>sameDay(it.when,now));
  const out=document.getElementById('jarvis-output');
  const bl=document.getElementById('jarvis-bullets');
  // security jumps the queue: an entry while you're away is the only thing that matters
  if(typeof entry!=='undefined'&&entry){
    out.innerHTML=`<span style="color:var(--alert)">Motion in your room ${entry} while you're away.</span> I've pushed it to your phone.`;
    bl.innerHTML='';bl.style.display='none';
    return;
  }
  const w=wx();
  const open=today.filter(i=>i.kind==='task'&&!i.done).length;
  const nextEv=today.find(i=>i.kind==='ev'&&i.when>now);
  const tmr=all.filter(it=>sameDay(it.when,new Date(now.getTime()+DAY)));
  const tmrFirst=tmr.find(i=>i.when.getHours()<23);
  const leaveLine=ev=>{const leave=new Date(ev.when-20*60000);return pick([
    `${nameIs(ev.n)} at ${fmtT(ev.when)}, so you'll want to be out by ${fmtT(leave)}.`,
    `You've got ${ev.n} at ${fmtT(ev.when)}. Out the door by ${fmtT(leave)}.`,
    `${fmtT(leave)} out the door gets you to ${ev.n} for ${fmtT(ev.when)}.`,
    `${ev.n} at ${fmtT(ev.when)}. That's leaving here about ${fmtT(leave)}.`],1)};
  /* the things worth saying out loud, computed rather than canned */
  const midnight=new Date(now);midnight.setHours(0,0,0,0);
  const nextImp=all.find(i=>i.imp&&!i.done&&i.when>now);
  const nightsTo=nextImp?Math.round((new Date(nextImp.when).setHours(0,0,0,0)-midnight)/DAY):null;
  const runway=()=>{ // how much room is left before the next big thing
    if(!nextImp)return null;
    // Only append the subtitle when it is actually a subject. "Chapters 5 and 6"
    // reads; "Zoom" gives "and it's zoom", which is a location pretending to be
    // one. One word is the tell.
    const sub=(nextImp.s||'').trim();
    const on=/\s/.test(sub) ? sub.charAt(0).toLowerCase()+sub.slice(1) : '';
    if(nightsTo===0)return `${nameIs(nextImp.n)} today at ${fmtT(nextImp.when)}.`;
    if(nightsTo===1)return `You've got ${nextImp.n} tomorrow at ${fmtT(nextImp.when)}.`;
    return on
      ? `${nameIs(nextImp.n)} ${nightsTo} days out, and it's ${on}.`
      : `${nameIs(nextImp.n)} ${nightsTo} days out.`;
  };
  const heavy=()=>{ // the day in the next week carrying the most real load
    const cnt={};
    // standing repeats (gym, water the plant) aren't load — they'd make every day
    // "heavy" — and neither are chores. A hair wash is five minutes; calling
    // Friday the fullest day because of one is just wrong.
    all.filter(i=>i.when>now&&i.when-now<7*DAY&&!i.rep&&!i.chore).forEach(i=>{
      const k=new Date(i.when).setHours(0,0,0,0);cnt[k]=(cnt[k]||0)+1+(i.imp?2:0);
    });
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    if(!top||top[1]<3)return null;
    const d=new Date(+top[0]);
    if(sameDay(d,now))return null;
    const on=all.filter(i=>sameDay(i.when,d)&&!i.rep&&!i.chore).slice(0,2).map(i=>i.n);
    // don't restate the thing the runway line already named
    if(on.length===1&&nextImp&&on[0]===nextImp.n)return null;
    return `${dayLabel(d)} looks like the busiest day, with ${on.join(' and then ')}.`;
  };
  const waterLine=()=>(typeof water==='undefined'||!water)?null:waterSay(h);
  const s=[];
  if(typeof away!=='undefined'&&away)s.push('Room is armed while you’re out.');
  const t=tempNow(w,h);
  // ── what it actually says ────────────────────────────────────────────────
  // The old version ran the same template every time: weather, then calendar,
  // then sleep, then water, five lines whatever the hour. That is what made it
  // read like a machine — not the wording. Nobody opens with the temperature
  // at 10pm, and nobody recites five facts when two of them matter.
  //
  // So: lead with the thing that matters at this hour, and mention the weather
  // only when it would change what he does. At night it never does.
  const notableWx = () => {
    if(w.rain) return pick([
      `there's rain from about ${hr12(w.rain[0])} till ${hr12(w.rain[1])}`,
      `it's wet between ${hr12(w.rain[0])} and ${hr12(w.rain[1])}`],3);
    if(w.hi>=88) return `it gets to ${w.hi} today`;
    if(w.lo<=38) return `it's down to ${w.lo} tonight`;
    if(w.wind>=14) return `the wind's up at ${w.wind}`;
    return null;                       // an ordinary day is not worth a line
  };

  // ── what it says ─────────────────────────────────────────────────────────
  // Two things make a briefing sound like a person rather than a report:
  // what it chooses to mention, and the fact that it chooses differently on
  // different days. So each hour has one LEAD (the thing that matters most
  // right then) and a POOL of optional observations. Two get drawn from the
  // pool, seeded on the date and hour, so the same Tuesday does not read like
  // last Tuesday. A beat returns null when it has nothing true to say, and
  // nulls simply do not appear.
  // "Wash hair" is an agenda item now, so the briefing reads it from there
  // rather than keeping a second copy of the schedule.
  const washToday = all.some(i=>i.n==='Wash hair'&&sameDay(i.when,now));
  const dow = now.getDay(), isWknd = dow===0||dow===6;
  const dayName = now.toLocaleDateString([],{weekday:'long'});
  // live sensor when there is a Pi, the synthetic constant otherwise
  const _rt = roomTempLive();
  const roomT = (_rt===null?ROOM_TEMP:_rt), roomWarm = roomT>=ROOM_USUAL+3, roomCold = roomT<=ROOM_USUAL-3;

  // does rain land on top of something he has to be at?
  // Only a clash if it is still ahead of him. Telling him at 4pm that he got
  // rained on at 9am is not a briefing, it is a diary.
  const rainClash = (()=>{
    if(!w.rain || h>=w.rain[1]) return null;
    const hit = all.find(i=>i.kind==='ev' && sameDay(i.when,now) && i.when>now
      && i.when.getHours()>=w.rain[0]-1 && i.when.getHours()<=w.rain[1]);
    return hit ? {ev:hit} : null;
  })();

  const draw = (pool, n) => {
    const live = pool.map(f=>{try{return f()}catch(e){return null}}).filter(Boolean);
    const out = [];
    for(let i=0;i<live.length&&out.length<n;i++) out.push(live[(seed+i*3)%live.length]);
    return [...new Set(out)];
  };

  // ── beats, shared across hours ──────────────────────────────────────────
  const bWeather = () => {
    if(w.rain && h < w.rain[1]) return pick([
      `There's rain from about ${hr12(w.rain[0])} till ${hr12(w.rain[1])}.`,
      `It's wet between ${hr12(w.rain[0])} and ${hr12(w.rain[1])}.`,
      `Rain comes through around ${hr12(w.rain[0])} and clears by ${hr12(w.rain[1])}.`],3);
    if(w.hi>=88) return pick([`It gets up to ${w.hi} today.`,
                              `${w.hi} is the high, so it'll be a warm one.`],3);
    if(w.lo<=40) return pick([`It drops to ${w.lo} tonight.`,
                              `Cold one tonight, down to ${w.lo}.`],3);
    if(w.wind>=14) return pick([`The wind's up at ${w.wind}.`,
                                `${w.wind} of wind today, so it'll feel cooler than it is.`],3);
    return null;
  };
  const bRainClash = () => rainClash ? pick([
      `Rain's around when you're at ${rainClash.ev.n}, so you'll be walking back in it.`,
      `${nameIs(rainClash.ev.n)} right in the middle of the rain.`],13) : null;
  const bRoom = () => roomWarm ? pick([
      `It's ${roomT} in here, warmer than you usually keep it.`,
      `Your room's sitting at ${roomT}.`],14)
    : roomCold ? `It's ${roomT} in here, cooler than usual.` : null;
  const bSleep = () => SLEEP_BEST ? pick([
      `You slept ${fmtDur(SLEEP_LAST_MIN)}, the most you've managed all week.`,
      `${fmtDur(SLEEP_LAST_MIN)} last night, which is your best of the week.`],9) : null;
  const bWater = () => waterLine();
  const bRunway = () => { const r=runway(); return (r&&nightsTo<=3)?r:null };
  const bHeavy = () => heavy();
  const bWash = () => washToday ? pick([
      'Wash day, if you get round to it.',
      "It's a wash day today."],15) : null;
  const bWeekend = () => isWknd ? pick([
      `${dayName}, so nothing has to happen at any particular time.`,
      `It's ${dayName}.`],16) : null;
  const bSunset = () => (h>=15&&h<19) ? `Sun's down at ${hr12(w.sunset||20)}.` : null;

  if(h>=5&&h<11){            // morning: what's first, then a couple of things
    if(nextEv){
      const leave=new Date(nextEv.when-TRAVEL_MIN*60000);
      s.push(pick([
        `${nameIs(nextEv.n)} at ${fmtT(nextEv.when)}, so you'll want to be out by ${fmtT(leave)}.`,
        `You've got ${nextEv.n} at ${fmtT(nextEv.when)}, so out the door around ${fmtT(leave)}.`,
        `First thing is ${nextEv.n} at ${fmtT(nextEv.when)}. That's leaving about ${fmtT(leave)}.`],1));
    }else{
      s.push(pick([
        `Nothing on this morning, so it's ${t} out and yours.`,
        `Your morning's clear. ${t} out at the moment.`,
        `Nothing until later today.`],1));
    }
    s.push(...draw([bWeather, bSleep, bRainClash, bWash, bWeekend, bRoom, bRunway, bHeavy], 2));

  }else if(h>=11&&h<17){     // afternoon
    if(nextEv)s.push(leaveLine(nextEv));
    else s.push(pick([
      "Nothing else on today, so the rest of it's yours.",
      "That's you done for the day as far as the calendar goes.",
      'Nothing left on the calendar from here.'],6));
    s.push(...draw([bWater, bRainClash, bWeather, bRoom, bWash, bRunway, bHeavy, bSunset], 2));

  }else if(h>=17&&h<22){     // evening
    if(nextEv)s.push(leaveLine(nextEv));
    else s.push(pick([
      "Nothing else on tonight, so the evening's yours.",
      "That's everything for today.",
      "You're done for the day."],7));
    const bTomorrow = () => tmrFirst ? pick([
        `Tomorrow starts with ${tmrFirst.n} at ${fmtT(tmrFirst.when)}.`,
        `First thing tomorrow is ${tmrFirst.n} at ${fmtT(tmrFirst.when)}.`],11) : null;
    s.push(...draw([bTomorrow, bWater, bWash, bRunway, bWeather, bRoom], 2));

  }else{                     // night: one thing, which is when to go to bed
    // No debt figures and no encouragement. At 1am the only useful sentence is
    // a time, so that is nearly the whole briefing.
    const late = h<5 ? 'Still up' : 'Getting late';
    const nextUp = all.find(i => i.when > now) || null;
    const soon = nextUp && (nextUp.when - now) < 18*3600000 ? nextUp : null;

    let wake;
    if(soon){
      wake = new Date(soon.when - (TRAVEL_MIN+GET_READY_MIN)*60000);
    }else{
      wake = new Date(now);
      if(h >= 5) wake.setDate(wake.getDate()+1);
      wake.setHours(DEFAULT_WAKE_H, DEFAULT_WAKE_M, 0, 0);
    }
    const bed = new Date(wake - SLEEP_TARGET_H*3600000);

    // A bedtime outside a plausible night is arithmetic, not advice: an 11:30
    // gym works out to 2:40am. When it does not bind, say what is on instead.
    const bedBinds = bed.getHours()>=20 || bed.getHours()<=1;
    if(!bedBinds && soon){
      s.push(pick([
        `${late}, but nothing's early tomorrow. First thing is ${soon.n} at ${fmtT(soon.when)}.`,
        `${late}. Nothing early tomorrow, ${soon.n} at ${fmtT(soon.when)} is the first thing.`],12));
    }else if(now < bed){
      s.push(soon
        ? pick([`${nameIs(soon.n)} at ${fmtT(soon.when)}, so bed around ${fmtT(bed)} gives you eight hours.`,
                `${late}. Bed by about ${fmtT(bed)} puts you at eight before ${soon.n} at ${fmtT(soon.when)}.`,
                `Eight hours before ${soon.n} at ${fmtT(soon.when)} means turning in around ${fmtT(bed)}.`],12)
        : pick([`Nothing on tomorrow, so if you're up around ${fmtT(wake)}, bed by ${fmtT(bed)} gives you eight hours.`,
                `${late}. Nothing on tomorrow, so bed around ${fmtT(bed)} still gets you eight before a ${fmtT(wake)} start.`],12));
    }else{
      // Past it. A bedtime you have already missed is no use, but the hours
      // still available are, and that is a fact rather than a telling off.
      const left = Math.max(0, Math.round((wake - now)/60000));
      s.push(soon
        ? pick([`Going to bed now still gets you ${fmtDur(left)} before ${soon.n} at ${fmtT(soon.when)}.`,
                `${fmtDur(left)} left if you turn in now, before ${soon.n} at ${fmtT(soon.when)}.`],12)
        : pick([`Going to bed now still gets you ${fmtDur(left)} before a ${fmtT(wake)} start.`,
                `${fmtDur(left)} if you go now, on a ${fmtT(wake)} start.`],12));
    }
  }
  out.innerHTML=s.map((line,i)=>`<div class="jl${i===0?' lead':''}">${line}</div>`).join('');
  // ★ bullets: important items in the next ten days, soonest first
  const imps=all.filter(i=>i.imp&&!i.done&&i.when>now&&i.when-now<10*DAY).slice(0,3);
  // On a short wall the briefing can outgrow its box. Drop lines off the end,
  // which are the least load-bearing, so the ★ items are never the thing that
  // falls off the screen.
  requestAnimationFrame(()=>{
    let guard=0;
    while(out.scrollHeight>out.clientHeight+1&&out.children.length>1&&guard++<20)
      out.removeChild(out.lastElementChild);
  });
  bl.innerHTML=imps.map(i=>{
    const dl=sameDay(i.when,now)?'Today':dayLabel(i.when)==='Tomorrow'?'Tomorrow'
      :i.when.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
    return `<div class="jb"><span class="st"><svg class="ico star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 2.6l2.7 5.9 6.3.7-4.7 4.3 1.3 6.3L12 16.7 6.4 19.8l1.3-6.3L3 9.2l6.3-.7z"/></svg></span><b>${i.n}</b><span class="when">${dl} · ${fmtT(i.when)}</span></div>`;
  }).join('');
  bl.style.display=imps.length?'':'none';
}

/* water ─────────────────────────────────────────────────────────────
   Logging comes from the phone buttons below. A desk button is wired on the
   backend too (pi/flic_hydration.py: click a glass, double a bottle, hold to
   undo) for whenever that hardware exists; entries it posts get tagged 'flic'
   and the card names them. Off the Pi there is no endpoint, so the demo falls
   back to a synthetic day that fills itself in as the hours pass, and the
   buttons still work, they just stay local. */
const WATER_API='/api/hydration';
/* The target isn't a fixed 80. Heat and a workout both cost water, which is what
   the bottle project measured, so the day's number moves with them. On the Pi this
   belongs in _target_oz() in app.py with real weather; here the weather is the same
   synthetic day the briefing reads. */
const WATER_BASE=80;
function waterTarget(){
  const w=wx(),bump=[];
  let t=WATER_BASE;
  if(w.hi>=92){t+=12;bump.push(`${w.hi} out`)}
  else if(w.hi>=85){t+=8;bump.push(`${w.hi} out`)}
  // a workout counts for the whole day, so this looks at today's schedule, not
  // only what's still ahead — repItems() drops anything already past
  const rx=/\b(gym|run|running|lift|workout|soccer|basketball|practice|ride)\b/i;
  const today=new Date();
  const act=ITEMS.find(i=>sameDay(i.when,today)&&rx.test(i.n))
    ||REPS.find(r=>rx.test(r.n)&&(r.freq==='daily'||+r.freq===today.getDay()));
  if(act){t+=8;bump.push(act.n.toLowerCase())}
  return {oz:t,why:bump};
}
function demoWater(){
  // a normal day: two glasses in the morning, the Owala at lunch, glasses after
  const plan=[[8,10,12],[10,25,12],[12,50,24],[15,20,12],[18,5,12],[20,40,12]];
  const now=new Date(),log=[];
  plan.forEach(([H,M,oz])=>{
    const t=new Date();t.setHours(H,M,0,0);
    if(t<=now)log.push({ts:t.toISOString(),oz,src:'app'});
  });
  return {total_oz:log.reduce((a,e)=>a+e.oz,0),target_oz:waterTarget().oz,
          servings:{single:8,glass:12,double:32},log,live:false};
}
let water=demoWater();
const W_FROM=8,W_TO=21;                       // the drinking day, 8am to 9pm
function paintTrack(){
  const t=water.target_oz||WATER_BASE;
  const pct=v=>Math.min(100,Math.max(0,v/t*100))+'%';
  document.getElementById('wPace').style.width=pct(t*waterPace());
  document.getElementById('wFill').style.width=pct(water.total_oz);
  const el=document.getElementById('wTrack'),r=hydration();
  el.setAttribute('aria-valuemax',t);
  el.setAttribute('aria-valuenow',water.total_oz);
  el.setAttribute('aria-valuetext',`${water.total_oz} of ${t} oz, `+
    (r.behind>0?`${r.behind} glass${r.behind>1?'es':''} behind`:'on pace'));
}

/* how far through the day you'd be if you drank it evenly, 8am to 9pm */
function waterPace(){
  const n=new Date();
  return Math.min(1,Math.max(0,(n.getHours()+n.getMinutes()/60-W_FROM)/(W_TO-W_FROM)));
}
/* One read of the day's water, shared by the chart and by what MonCoeur says, so
   the two can never disagree. "behind" rounds to whole glasses: being a mouthful
   under pace is not worth a sentence. */
function hydration(){
  const t=water.target_oz||WATER_BASE;
  const g=(water.servings&&water.servings.single)||8;
  const due=t*waterPace(),left=Math.max(0,t-water.total_oz);
  const log=water.log||[];
  const last=log.length?new Date(log[log.length-1].ts):null;
  return {t,g,total:water.total_oz,due:Math.round(due),left,met:left<=0,
    behind:Math.max(0,Math.round((due-water.total_oz)/g)),
    glassesLeft:Math.ceil(left/g),
    last,gap:last?(Date.now()-last)/3600000:null};
}
/* What MonCoeur says about water, at most one line, and nothing at all when the
   day is going fine. Morning explains the number, the middle of the day watches
   the gaps, night stops asking him to drink and just says how it went. */
function waterSay(h){
  const r=hydration(),tg=waterTarget();
  // Every line below counts in oz, not glasses. An earlier draft phrased the
  // shortfall as "two glasses", which stopped being safe the moment the middle
  // button became 12 oz while the pace unit stayed 8: the same word would have
  // meant two amounts in one sentence. The helpers that built those phrases are
  // gone; if a glass count ever comes back it has to say which glass.
  if(h>=5&&h<11){
    if(!r.total&&h>=8)return `Nothing logged yet today.`;
    if(r.behind>=1)return `You're at ${r.total} oz for the day.`;
    return null;
  }
  if(h>=11&&h<17){
    if(r.met)return null;
    if(WATER_ON_PACE&&r.total&&r.behind<1)
      return `You're at ${r.total} oz, which is about where you normally are by now.`;
    if(r.gap!==null&&r.gap>=3)
      return `Nothing since ${fmtT(r.last)}, so that's about ${Math.round(r.gap)} hours.`;
    if(r.behind>=1)
      return `You're at ${r.total} oz for the day.`;
    return null;
  }
  if(h>=17&&h<22){
    if(r.met)return WATER_STREAK>=3
      ? `Water's done for the day. That's ${WATER_STREAK} days running now.`
      : `Water's done for the day at ${r.total} oz.`;
    if(r.behind>=1)return `You're at ${r.total} oz for the day.`;
    return null;
  }
  // night: telling him to drink at 1am is how you get up at 4am
  if(!r.met&&r.left>=2*r.g)return `You finished ${r.left} oz short today.`;
  return null;
}
function paintWater(){
  const t=water.target_oz||96,left=Math.max(0,t-water.total_oz);
  const glass=(water.servings&&water.servings.single)||8;
  document.getElementById('wNum').innerHTML=water.total_oz+`<u>of ${t} oz</u>`;
  document.getElementById('wLeft').textContent=left?left+' oz left':'target met';

  paintTrack();
  const last=water.log&&water.log[water.log.length-1];
  document.getElementById('wSub').textContent=last
    ?`${last.oz} oz at ${fmtT(new Date(last.ts))}${last.src==='flic'?' · button':''}`
    :'Nothing logged yet today.';
  // The drawer says the number too, so pressing + in there gives feedback
  // without having to close it and look at the card.
  const dt=document.getElementById('wDrawTot');
  if(dt)dt.textContent=`${water.total_oz} / ${t} oz`;
  const dh=document.getElementById('wDrawHint');
  if(dh)dh.textContent=left?`${left} OZ LEFT`:'TARGET MET';
}
/* ── the backend, when there is one ───────────────────────────────────────────
   This page has two lives. On GitHub Pages it is a portfolio demo with no Pi
   behind it, so everything falls back to a synthetic day. On the wall in his
   room the Pi answers, and then the server owns the truth: it merges the
   agenda, writes the briefing, and knows whether its own data is stale.

   The rule for going live is one probe, not one per feature — a page with no
   backend should not fire five 404s every twenty seconds. When nothing answers
   it backs off to five minutes and stays synthetic.                          */
const LIVE={on:false,everOn:false,wallMode:'dashboard',fresh:null,brief:null,agenda:null,note:null,miss:0,es:null,timer:null};

async function api(path,opts){
  const r=await fetch(path,Object.assign({cache:'no-store'},opts||{}));
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
function reschedule(ms){clearTimeout(LIVE.timer);LIVE.timer=setTimeout(pull,ms)}

async function pull(){
  try{
    // ONE probe decides live-ness. Firing the whole set in parallel would put
    // three 404s in the console of every portfolio visitor before we even know
    // whether a Pi exists — so the rest waits until this one answers.
    const brief=await api('/api/brief');
    // days=14, not 7. The frontend horizon was widened first and nothing
    // changed, because the data was never asked for: the server was being told
    // to send a week and then blamed for stopping at Thursday. build_agenda()
    // defaults to 14, so this asks for what it already builds.
    const [ag,w,wall]=await Promise.all([api('/api/agenda?days=14'),api(WATER_API),
                                        api('/api/wall').catch(()=>null)]);
    LIVE.on=true;LIVE.everOn=true;LIVE.miss=0;
    LIVE.brief=brief;LIVE.fresh=brief.fresh;LIVE.agenda=ag.days;
    if(wall&&wall.mode)LIVE.wallMode=wall.mode;
    if(typeof w.total_oz==='number')water=Object.assign(w,{live:true});
    applyLive();
    subscribe();
    pullNote();
    // SSE carries the fast path; this is only a floor in case it drops.
    reschedule(60000);
    return;
  }catch(e){/* no Pi on the other end */}
  LIVE.miss++;
  if(LIVE.on){LIVE.on=false;LIVE.fresh=null;LIVE.everOn=true}
  if(!water.live){water=demoWater()}
  applyLive();
  // Two different callers, two different right answers. A portfolio visitor's
  // browser will never find a Pi, so backing off to five minutes stops it
  // hammering. The wall HAS found one before, so the same five minutes would
  // leave it showing demo data for five minutes after the Pi reboots. Once it
  // has ever been live it keeps trying at a steady 15s.
  reschedule(LIVE.everOn ? 15000 : (LIVE.miss>=3 ? 300000 : 20000));
}

/* A Flic press should land on the wall in about a second, not whenever the
   next poll happens to come round. */
function subscribe(){
  if(LIVE.es||!window.EventSource)return;
  try{
    const es=new EventSource('/api/stream');
    es.addEventListener('change',()=>{clearTimeout(LIVE.timer);pull()});
    es.onerror=()=>{try{es.close()}catch(_){ }LIVE.es=null};
    LIVE.es=es;
  }catch(e){/* no SSE: the 60s floor still refreshes */}
}

/* The weekly finding. Cheap, slow-moving, so once an hour is plenty. */
let noteAt=0;
async function pullNote(){
  if(Date.now()-noteAt<3600000)return;
  noteAt=Date.now();
  try{
    const p=await api('/api/patterns');
    LIVE.note=(p.ready&&p.findings&&p.findings.length)?p.findings[0].text:null;
  }catch(e){LIVE.note=null}
  paintNote();
}
function paintNote(){
  const el=document.getElementById('jarvis-note');
  if(!el)return;
  if(LIVE.note){el.textContent=LIVE.note;el.hidden=false}
  else{el.textContent='';el.hidden=true}
}

/* The server's agenda, reshaped into what render() already draws. Repeats are
   expanded server-side when live, so the client stops expanding its own. */
function serverItems(days){
  const out=[];
  (days||[]).forEach(d=>(d.items||[]).forEach(i=>{
    const t=(i.time||'23:59').slice(0,5);
    out.push({when:new Date(d.date+'T'+t+':00'),n:i.name,s:i.sub||'',
              kind:i.kind==='event'?'ev':'task',done:!!i.done,imp:!!i.starred,
              id:i.id,src:i.source,editable:i.editable!==false});
  }));
  return out;
}

function applyLive(){
  // stale means the room readings are old; drop them rather than dress them up
  document.body.dataset.stale=(LIVE.fresh===false)?'1':'';
  // the "synthetic data" banner is honest on the portfolio demo and a lie on
  // the wall, where every number on screen is real
  const bn=document.getElementById('demoBanner');
  if(bn)bn.style.display=LIVE.on?'none':'';
  if(LIVE.on&&LIVE.agenda){ITEMS=serverItems(LIVE.agenda)}
  // Keep the lamp tile honest: the Flic and presence both change the lights
  // without the screen knowing, so read the state back rather than trusting
  // whatever this client last set.
  syncLights();
  syncRoomTemp();
  // The first pull is what tells us a Pi exists; the course list has to be
  // re-read at that point or it stays on the demo names for the whole session.
  if(LIVE.on&&!applyLive._courses){applyLive._courses=true;loadCourses();loadShop();loadReps();loadWallAuto()}
  if(LIVE.on)applyWallMode(LIVE.wallMode||'dashboard');
  // The Away toggle, the motion trigger and the stale switch stand in for
  // sensors that are real on the Pi. On the wall they are not controls, they
  // are lies, so they go the moment a Pi answers.
  const dm=document.getElementById('demoOnly');
  if(dm)dm.style.display=LIVE.on?'none':'';
  const pw=document.getElementById('pwSec');
  if(pw)pw.style.display=LIVE.on?'':'none';
  // Same reasoning as the password form: with no Pi there is nothing to save it
  // to and no motion sensor to read, so offering the control would be a lie.
  const wa=document.getElementById('waSec');
  if(wa)wa.style.display=LIVE.on?'':'none';
  if(!LIVE.on)applyLive._courses=false;
  paintWater();
  render();
  jarvisRender();
  paintNote();
}

async function logWater(oz){
  if(water.live){
    const undo=oz<0;
    try{
      const r=await fetch(WATER_API+(undo?'/undo':''),{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(undo?{}:{oz,src:'wall'})});
      if(r.ok){water=Object.assign(await r.json(),{live:true});paintWater();jarvisRender();return}
    }catch(e){/* fall through and keep it local rather than swallow the press */}
  }
  if(oz<0)water.log.pop();
  else water.log.push({ts:new Date().toISOString(),oz,src:'wall'});
  water.total_oz=water.log.reduce((a,e)=>a+e.oz,0);
  paintWater();jarvisRender();
}

/* Homework, from the phone. The wall shows; the phone edits. */
async function addHomework(){
  const name=document.getElementById('hwName').value.trim();
  const due=document.getElementById('hwDue').value;
  const hint=document.getElementById('hwHint');
  if(!name||!due){hint.textContent=!name?'NEEDS A NAME':'NEEDS A DUE DATE';return}
  const body={name,due_date:due,type:document.getElementById('hwType').value,
              course:document.getElementById('hwCourse').value.trim()||null};
  if(LIVE.on){
    try{
      await api('/api/assignments',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      hint.textContent='ADDED';
      document.getElementById('hwName').value='';
      loadCourses();
      clearTimeout(LIVE.timer);pull();
      return;
    }catch(e){hint.textContent='COULD NOT SAVE'}
  }
  // demo with no Pi: put it on the board anyway so the flow is visible
  ITEMS.push({when:new Date(due+'T23:59:00'),n:name,
              s:body.course||'',kind:'task',done:false});
  document.getElementById('hwName').value='';
  hint.textContent='ADDED (DEMO)';
  render();
}
/* One tap. Marking a bad day should not itself be work, and a migraine day is
   exactly the day he will not feel like filling in a form. */
async function mark(kind,daysAgo){
  const hint=document.getElementById('mkHint');
  const d=new Date(Date.now()-(daysAgo||0)*864e5).toISOString().slice(0,10);
  if(!LIVE.on){hint.textContent='NEEDS THE PI';return}
  try{
    const r=await api('/api/mark',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind,date:d})});
    hint.textContent=r.marked?('MARKED '+d).toUpperCase():('CLEARED '+d).toUpperCase();
    clearTimeout(LIVE.timer);pull();
  }catch(e){hint.textContent='COULD NOT SAVE'}
}

/* Courses come off the calendar on the Pi (course_list), so the buttons are
   there on day one without him typing a code once. Each carries that class's
   next meeting, because homework is nearly always due at the next class —
   which turns adding one into two taps and no date picking. */
const DEMO_COURSES=[
  {code:'ELEE 4230', next:dISO(1), nextTime:'9:00 AM'},
  {code:'PHYS 203',  next:dISO(1), nextTime:'6:00 PM'},
  {code:'HIST 2111', next:dISO(2), nextTime:'11:00 AM'},
  {code:'MATH 2700', next:dISO(3), nextTime:'1:00 PM'}
];
function dISO(off){const n=new Date();n.setDate(n.getDate()+off);
  return new Date(n.getTime()-n.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

function paintCourses(list){
  const box=document.getElementById('hwCourseChips');
  const dl=document.getElementById('hwCourses');
  if(dl)dl.innerHTML=list.map(c=>`<option value="${c.code}">`).join('');
  if(!box)return;
  box.innerHTML='';
  list.forEach(c=>{
    const b=document.createElement('span');
    b.className='chip';
    b.textContent=c.code;
    if(c.next)b.title='Next meeting '+c.next+(c.nextTime?' at '+c.nextTime:'');
    b.onclick=()=>{
      document.getElementById('hwCourse').value=c.code;
      // Date it to the next meeting when we know one, and leave whatever is
      // already there when we don't, rather than guessing at a date.
      if(c.next)document.getElementById('hwDue').value=c.next;
      box.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      document.getElementById('hwName').focus();
    };
    box.appendChild(b);
  });
}

/* There is no tick list in the drawer. It listed every recurring thing on the
   calendar so the guess could be corrected — Exec Meeting, All Chairs Meeting
   and the rest alongside the five real classes — and Zack's answer was that
   Settings should show his classes and nothing else. The chips above are that
   list. /api/courses/candidates still exists and still takes a correction, so
   if the detection ever gets a class wrong it can be fixed with one POST
   without putting the whole calendar back on screen. */

async function loadCourses(){
  if(!LIVE.on){paintCourses(DEMO_COURSES);return}
  try{
    const list=await api('/api/courses');
    paintCourses(Array.isArray(list)?list.map(c=>typeof c==='string'?{code:c}:c):[]);
  }catch(e){paintCourses(DEMO_COURSES)}
}
loadCourses();

/* Three sizes: 8 oz the Flic's press and any small pour, 12 the glass he
   actually drinks from, 32 the Owala. Rounding the first two together loses a

document.getElementById('wSmall').onclick=()=>logWater((water.servings&&water.servings.single)||8);
document.getElementById('wGlass').onclick=()=>logWater((water.servings&&water.servings.glass)||12);

document.getElementById('wUndo').onclick=()=>logWater(-1);

document.getElementById('wGlass2').onclick=()=>logWater((water.servings&&water.servings.glass)||12);
document.getElementById('wBottle2').onclick=()=>logWater((water.servings&&water.servings.double)||32);
document.getElementById('wUndo2').onclick=()=>logWater(-1);
document.getElementById('waAfter').onchange=saveWallAuto;
document.getElementById('waReturn').onchange=saveWallAuto;
document.getElementById('hwAdd').onclick=addHomework;
/* Any of the last fortnight, because a migraine day is rarely a day you feel
   like logging anything, and it was two buttons that could only reach as far
   back as yesterday. Named days beyond that: "Thu 13" is easier to pick
   correctly than a date field is to type. */
(function fillMkDays(){
  const sel=document.getElementById('mkDay');
  if(!sel)return;

document.getElementById('mkMigraine').onclick=()=>
  mark('migraine',parseInt(document.getElementById('mkDay').value,10)||0);
document.getElementById('hwDue').value=new Date(Date.now()+864e5).toISOString().slice(0,10);
paintWater();
pull();   // reschedules itself, faster when the Pi is answering

render();
paintSecurity();
matchMedia('(min-aspect-ratio:5/4)').addEventListener('change',render);

 ["to really like something",
