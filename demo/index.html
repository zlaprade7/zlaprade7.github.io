<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>MonCoeur, live demo (synthetic data)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Add to Home Screen, from Safari. Without apple-mobile-web-app-capable it
     installs as a bookmark that opens in Safari with the address bar still
     there; with it, it launches standalone and looks like an app. The title is
     what appears under the icon, so it is the product name and not the <title>,
     which says "Live Demo (synthetic data)".
     The icon is served from the Pi at /static/. On the portfolio demo that path
     does not exist and Safari just falls back to a screenshot, which is fine —
     nobody installs the demo. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MonCoeur">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1220">
<link rel="apple-touch-icon" href="/static/moncoeur-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/moncoeur-512.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#0a1220;--card:#101b30;--card2:#16233a;--hover:#1c2b46;
  --br:rgba(255,255,255,.1);--tx:#eef1f6;--t2:#aeb9cc;--tm:#828fa5;
  --accent:#c3cbd6;--accentL:rgba(195,203,214,.12);--accentD:#e2e7ee;
  --blue:#7da0ff;--blueL:rgba(125,160,255,.14);
  --alert:#e0796b;--alertL:rgba(224,121,107,.12);
  --f:'Outfit',sans-serif;--fm:'JetBrains Mono',monospace;--fs:'Literata',Georgia,serif;
}
[data-theme="light"]{
  --bg:#f4f2ec;--card:#fdfdfb;--card2:#f3f0e8;--hover:#ece8dc;
  --br:#e0dbcd;--tx:#191c22;--t2:#4b5563;--tm:#686c77;
  --accent:#7e8896;--accentL:#e8ebef;--accentD:#5a6472;
  --blue:#3b6fd6;--blueL:#e3ebfb;
  --alert:#c1503f;--alertL:#f6e3df;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f);color:var(--tx);background:
 radial-gradient(900px 500px at 15% -10%,#12203a,transparent 60%),
 radial-gradient(700px 500px at 110% 110%,rgba(16,32,58,.4),transparent 60%),var(--bg);}
[data-theme="light"] body{background:var(--bg)}
.mono{font-family:var(--fm)}
button{font-family:var(--f);cursor:pointer}
.hd{font-family:var(--fm);font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--t2);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding:14px 16px}
.demo-banner{font-family:var(--fm);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--accentL);color:var(--accentD);text-align:center;padding:5px;border-bottom:1px solid var(--br)}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--br)}
.top>:last-child{justify-self:end}
.clockwrap{justify-self:center}
.brand{font-family:var(--fs);font-size:22px;font-weight:600}
.brand em{color:var(--accent);font-style:normal}
.clockwrap{display:flex;align-items:baseline;gap:14px}
#clock{font-family:var(--fm);font-size:34px;font-weight:700;letter-spacing:.02em}
.tbtn{border:1px solid var(--br);background:transparent;color:var(--t2);border-radius:100px;padding:7px 14px;font-size:13px;transition:.2s}
.tbtn:hover{border-color:var(--accent);color:var(--tx)}
/* the bar mirrors the columns under it: controls sit over MonCoeur on the left,
   the room reading sits over the agenda on the right */
.topleft{display:flex;align-items:center;gap:9px}
.topright{justify-self:end;display:flex;align-items:center;gap:9px}
.tpill{height:38px;min-width:38px;border-radius:100px;border:1px solid var(--br);background:transparent;color:var(--t2);font-family:var(--fm);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 13px;transition:.2s}
/* 72° indoors next to a briefing about 84 outside needs saying which is which */
.tpill i{font-style:normal;font-size:.63em;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--tm);margin-right:8px}
/* ── photo mode ────────────────────────────────────────────────────────────
   Full bleed, no clock, no chrome. Two slides that cross-fade, so a photo is
   never replaced by a gap.

   The blurred copy behind is what stops a portrait photo sitting in black bars
   on a landscape wall: same image, scaled to cover, blurred past recognition
   and darkened, with the real one centred on top. */
#photoLayer{position:fixed;inset:0;z-index:60;background:#000;
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
#photoLayer.on{opacity:1;visibility:visible;transition:opacity .45s ease}
.pslide{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease}
.pslide.show{opacity:1}
/* the backdrop. A CSS blur this wide is a convolution over a full-screen
   surface every composited frame, and it runs at the same time as the drift and
   the cross-fade below it. On the Pi that is where the panel would stutter, so
   when the Pi has Pillow the backdrop arrives already blurred and dimmed at
   64px (/photo/<id>/blur) and .pre turns the filter off entirely. Without
   Pillow there is no such variant and the browser does the work, correctly and
   more slowly. */
.pslide::before{content:'';position:absolute;inset:-8%;
  background-image:var(--blur,var(--img));background-size:cover;
  background-position:center;
  filter:blur(38px) brightness(.42) saturate(.85);transform:scale(1.1)}
#photoLayer.pre .pslide::before{filter:none}
/* THE PHOTO ITSELF, or two of them.

   Neither cover nor contain makes a phone photo look right on an 800x480 wall.
   contain leaves a portrait shot at 360 of 800 pixels, marooned. cover fills the
   glass by cropping a portrait down to a horizontal band, which takes the top of
   someone's head off. Both are wrong, and no threshold between them is right.

   So: portraits go up in PAIRS, side by side, each one whole. Two upright photos
   fill a landscape screen exactly the way one of them cannot. A landscape photo
   still goes up alone, filling the screen on its own.

   Each photo is `contain` inside its own half or whole, so nothing is ever
   stretched, squashed or cropped. That was the actual complaint: the picture no
   longer looked like itself. */
.pgrid{position:absolute;inset:0;display:flex;gap:10px;padding:10px;
  align-items:stretch;justify-content:center}
.pimg{flex:1 1 0;min-width:0;background-repeat:no-repeat;background-position:center;
  background-size:contain;border-radius:4px;
  transform:scale(1);transition:transform 30s linear}
.pslide.show .pimg{transform:scale(1.03)}
/* One landscape photo has no gutters to justify; it takes the whole glass. */
.pgrid.solo{gap:0;padding:0}
.pgrid.solo .pimg{border-radius:0}

#photoLayer .pempty{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--tm);font-family:var(--fm);font-size:13px;
  letter-spacing:.1em;text-transform:uppercase}

/* Presence is a symbol, not a control: no pill, no border, no word. It should
   read the way a standby light on a stereo does — you only notice it when you
   go looking. Same footprint as the lamp's bulb so the two read as a pair. */
.pdot{width:15px;height:15px;border-radius:50%;flex:0 0 auto;margin:0 5px 0 3px;
  background:color-mix(in srgb,var(--t2) 55%,transparent);transition:.4s}
.pdot.away{background:color-mix(in srgb,var(--tm) 30%,transparent)}
.lampbtn{cursor:pointer;padding:0 12px}
.lampbtn .bulb{width:15px;height:15px;border-radius:50%;background:var(--br);transition:background .3s,box-shadow .3s}
.lampbtn.on{border-color:color-mix(in srgb,var(--lamp) 50%,var(--br))}
.lampbtn.on .bulb{background:var(--lamp);box-shadow:0 0 10px 2px color-mix(in srgb,var(--lamp) 50%,transparent)}
.lampbtn:active{transform:scale(.94)}
.gearbtn{width:38px;height:38px;border-radius:100px;border:1px solid var(--br);background:transparent;color:var(--t2);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.2s}
.gearbtn:hover{border-color:var(--accent);color:var(--tx);transform:rotate(45deg)}

/* JARVIS sits at the top of the right column: tag above the line, not beside it,
   so a long sentence doesn't get squeezed into a narrow gutter */
.jband{border:1px solid var(--br);border-left:3px solid var(--accent);border-radius:14px;background:linear-gradient(120deg,var(--accentL),var(--card) 60%);padding:12px 15px;display:flex;flex-direction:column;gap:10px;min-height:0;transition:padding .2s}
.jhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
/* a briefing reads as separate thoughts, not one run-on blob */
/* Sits under the name rather than floating in the middle of the card. It used
   to be five lines and centring filled the box; at two or three it left a hole. */
#jarvis-output{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:.55em;overflow:hidden}
.jl{line-height:1.4}
.jl.lead{color:var(--tx)}
/* ★ the big stuff coming up — tests, quizzes, interviews — always in view */
.jbullets{border-top:1px solid var(--br);padding-top:10px;display:flex;flex-direction:column;gap:7px;flex-shrink:0;margin-top:auto}
.jb{display:flex;gap:9px;align-items:baseline;font-size:14px;color:var(--t2)}
.jb .st{color:var(--accentD);flex-shrink:0}
.jb b{color:var(--tx);font-weight:600}
.jb .when{font-family:var(--fm);font-size:12px;color:var(--tm);margin-left:auto;flex-shrink:0}
.jband.collapsed .jbullets,.jband.collapsed #jarvis-output{display:none}
.jname{font-family:var(--fs);font-size:21px;font-weight:600;color:var(--tx);line-height:1}
.jname em{color:var(--accent);font-style:normal}
.jtoggle{grid-column:2;grid-row:1}
#jarvis-output{grid-column:1/-1;font-family:var(--fs);font-size:15px;line-height:1.45}
.jtoggle{flex-shrink:0;width:24px;height:24px;border-radius:100px;border:1px solid var(--br);background:transparent;color:var(--tm);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.2s}
.jtoggle:hover{border-color:var(--accent);color:var(--tx)}
.jband.collapsed{padding-top:8px;padding-bottom:8px}
.jband.collapsed #jarvis-output{display:none}

/* MonCoeur reads first, so it takes the left column and the agenda sits right.
   Order, not DOM order: the phone lays these out with its own order values. */
.deck{display:grid;grid-template-columns:1fr 1.08fr;gap:14px;padding:14px 20px 18px;min-height:0}
.main,.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.side{order:1}
.main{order:2}

/* unified agenda */
#agenda{flex:1}
#agList{overflow:auto;min-height:0;flex:1;margin-top:13px}
.dayh{font-family:var(--fm);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accentD);padding:15px 4px 5px;border-bottom:1px solid var(--br)}
.dayh:first-child{padding-top:2px}
.dayh:first-child{padding-top:2px}
.dayh small{color:var(--t2);letter-spacing:.06em;margin-left:8px;font-size:.92em}
/* tight rows: no checkbox column, the whole task row is the target.
   Sub-line only takes space when there is one, which is most of the savings. */
.row{display:grid;grid-template-columns:58px 3px 1fr;gap:11px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--br)}
.row.task{cursor:pointer}
.row .t{font-family:var(--fm);font-size:12.5px;color:var(--tm);text-align:right}
.row .rail{height:100%;min-height:20px;border-radius:2px;background:var(--blue)}
.row.task .rail{background:var(--accent)}
.row.now-ev{background:var(--blueL);border-radius:10px;border-bottom-color:transparent}

.row .n{font-size:15.5px;font-weight:600;line-height:1.25}
.row .n .imp{color:var(--accentD);margin-right:4px}
.row .s{font-size:12px;color:var(--tm);line-height:1.25}


/* settings drawer */
#ovl{position:fixed;inset:0;background:rgba(4,8,16,.55);backdrop-filter:blur(2px);z-index:90;display:none}
#drawer{position:fixed;top:0;right:-380px;width:min(380px,92vw);height:100%;background:var(--card);border-left:1px solid var(--br);z-index:95;transition:right .3s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;overflow:auto;
  /* The page sets viewport-fit=cover, so on an iPhone the top of the viewport is
     UNDER the status bar and the Dynamic Island. A flat 18px put Settings and the
     Close button up there, where iOS owns the pixels and the tap. The insets are
     0 on everything without a notch, so this costs the wall and the laptop
     nothing. Bottom too, for the home indicator. */
  padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
          calc(18px + env(safe-area-inset-bottom)) 18px}
#drawer.open{right:0}
#ovl.open{display:block}
/* Sections, so the drawer reads as a list of things rather than one long
   column of controls. A rule above each heading does the separating; the
   heading itself stays small and quiet. */
#drawer .drawtop{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:16px;border-bottom:1px solid var(--br)}
#drawer .sec{padding:18px 0 4px;border-top:1px solid var(--br)}
#drawer .sec:first-of-type{border-top:0;padding-top:16px}
#drawer .sech{display:flex;align-items:baseline;justify-content:space-between;
  font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
#drawer .subh{font-size:12px;color:var(--tm);line-height:1.45;margin-bottom:11px}
/* Explanation. Lowercase, because it is a sentence and not a readout. */
#drawer .hint{font-size:11.5px;color:var(--tm);line-height:1.5;margin:8px 0 2px}
#drawer .sec .rowset{margin-bottom:2px}
/* The panel talking back: dynamic status only, written by JS. It used to carry
   static prose as well, which is why the drawer read as though everything in it
   were shouting. Empty is the resting state and collapses to nothing, so a
   section is only as tall as it needs to be. */
#drawer .note{font-family:var(--fm);font-size:10px;line-height:1.5;color:var(--accent);
  letter-spacing:.06em;margin:7px 0 2px;min-height:0}
#drawer .note:empty{display:none;margin:0}
#drawer h4{font-family:var(--fm);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tm);margin:18px 0 8px}
#drawer .rowset{display:flex;gap:8px;margin-bottom:8px}
#drawer input,#drawer select{padding:8px 10px;border-radius:9px;border:1px solid var(--br);background:var(--card2);color:var(--tx);font-family:var(--f);font-size:13.5px}
#drawer input:focus{border-color:var(--accent)}
/* One row of ten. It used to wrap 9 + 1 and orphan Pink on a line of its own,
   which read as a bug; a two-row grid fixed that and looked like a colour
   picker rather than a strip of presets. Sized so ten fit the drawer width. */
.swatches{display:flex;gap:7px;flex-wrap:nowrap}
.sw{flex:0 0 auto}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.15s}
.sw:hover{transform:scale(1.12)}
.sw.sel{border-color:var(--tx);box-shadow:0 0 0 2px var(--card)}
#drawer input[type=range]{accent-color:var(--accent);background:transparent;border:none}
.chiplist{display:flex;flex-wrap:wrap;gap:7px}
.chip.on{border-color:var(--accent);color:var(--tx)}
.chip{font-size:13px;background:var(--card2);border:1px solid var(--br);border-radius:100px;padding:5px 12px;color:var(--t2);cursor:pointer}
.chip:hover{border-color:#c46;color:#e88}
.replist .cd{margin-bottom:7px;cursor:pointer}
.replist .cd:hover{border-color:#c46}

/* word of the day: one sense, shown in both languages side by side.
   The two columns are also what keeps the card from leaving dead space on the right. */
#motcard .sense{font-size:14.5px;color:var(--t2);margin-top:12px}
#motcard .pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,30px);margin-top:17px;padding-top:17px;border-top:1px solid var(--br)}
#motcard .lang{min-width:0}
/* a rule between the two languages, so they read as a pair rather than a run-on */
#motcard .lang+.lang{border-left:1px solid var(--br);padding-left:clamp(16px,2.4vw,30px)}
#motcard .lang .tag{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
#motcard .w{font-family:var(--fs);font-size:24px;margin-top:6px;line-height:1.15}
#motcard .p{font-family:var(--fm);font-size:12px;color:var(--tm);margin-top:3px;letter-spacing:.04em}
#motcard .ex{font-family:var(--fm);font-size:12px;color:var(--t2);margin-top:10px;line-height:1.55}

/* water: logging happens on the phone, so on the wall this card only reports.
   Ticks on the rail are one glass each — a glance gives you a count, not a
   percentage. Buttons are phone-side; the wall shows, the phone edits. */
#water{flex:0 0 auto}
#water .wrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:13px}
#water .wnum{font-family:var(--fm);font-size:27px;font-weight:700;letter-spacing:.01em;line-height:1}
#water .wnum u{font-style:normal;text-decoration:none;font-size:13px;font-weight:500;color:var(--tm);margin-left:6px}
#water .wsub{font-size:12.5px;color:var(--tm);text-align:right;line-height:1.3}
/* Two layers, nothing else: solid is what he's drunk, the ghost behind it is where
   even drinking would have him by now. Solid past ghost = ahead. Ghost showing
   past solid = that gap is the shortfall. */
#water .wtrack{position:relative;height:9px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:16px;min-width:0}
#water .wtrack span{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .45s ease}
/* The pace marker on the bar is also called "ghost" and is nothing to do with
   the add rows that were just removed. It is the faint layer showing where
   even drinking would have you by now. */
#water .ghost{opacity:.24}
/* the light track is close to the ghost's tone, so it needs more to read */
[data-theme="light"] #water .ghost{opacity:.36}
#water .fill{opacity:1}
#water .wacts{display:flex;gap:8px;margin-top:12px}
#water .wacts .tbtn{flex:1;padding:8px 10px}
#water .wacts .tbtn.undo{flex:0 0 auto;padding:8px 13px}

/* room: only the two things worth a permanent slot — how warm it is, and the light */


/* HORIZONTAL room display: one screen */
@media (min-aspect-ratio:5/4){
  body{overflow:hidden;display:flex;flex-direction:column}
  .deck{flex:1}
}
/* VERTICAL phone: top bar, then JARVIS (minimizable), then the schedule does most of the work */
@media (max-aspect-ratio:5/4){
  body{overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  /* Installed to the home screen the page runs full-bleed under the status bar,
     so the top bar has to hold its own clear of the notch. Zero everywhere else,
     including the wall, where the kiosk has no insets at all. */
  .top{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .deck{display:flex;flex-direction:column;gap:14px;height:auto;padding:14px 16px 20px}
  .main,.side{display:contents}
  #clock{font-size:26px}
  .brand{font-size:19px}
  .jband{padding:11px 14px}
  #jarvis-output{font-size:15.5px}
  /* the bar is tight at 375px: the room label and the date are wall aids, and the
     agenda's day headers already carry the date on the phone */
  .tpill i{display:none}
  /* Water before the agenda on the phone. It used to sit fourth, which put the
     buttons at y=999 under an 814px agenda on an 844px screen: logging a Bottle
     meant scrolling past the whole week, and Bottle is the one serving with no
     Flic gesture. The phone exists to log and edit; the agenda is what the wall
     is for. */
  #jband{order:1}
  #water{order:2}
  #agenda{order:3}
  #motcard{order:4}
}
/* "show nothing if it failed" — when the collector has gone quiet the room
   numbers are stale, so they are removed rather than shown with confidence.
   Water and the agenda have their own stores and stay put.
   The lamp button is a CONTROL, not a reading: hiding it because a temperature
   sensor went quiet takes away the light switch for no reason. */
[data-stale="1"] .tpill:not(.lampbtn){visibility:hidden}
/* Presence is NOT blanked with them: it comes from presence_ble.py, a separate
   process on a separate radio. The collector going quiet says nothing about
   whether the Bluetooth scan can still see his phone. */
[data-stale="1"] .jl.wx{display:none}
/* one quiet line: something it noticed that he wouldn't have */
.jnote{border-top:1px solid var(--br);margin-top:10px;padding-top:9px;
  font-family:var(--fs);font-size:13.5px;color:var(--tm);line-height:1.45}
.jband.collapsed .jnote{display:none}
#hwform .rowset{margin-top:6px}
#hwform input,#hwform select{min-width:0}
::selection{background:var(--accent);color:#0a1220}
/* visible keyboard focus (was missing / removed on inputs) — WCAG 2.4.7 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--br);border-radius:8px}

/* landscape wall-display proportions: read from across the room, so the clock
   anchors the bar and the cards get print-sized margins instead of phone ones */
@media (min-aspect-ratio:5/4){
  .top{padding:13px 26px}
  #clock{font-size:64px}
  .deck{gap:17px;padding:15px 26px 20px}
  .card{border-radius:18px}
  .pad{padding:16px 20px}
  .tpill{height:46px;font-size:22px}
  .gearbtn{width:46px;height:46px;font-size:22px}
  #jarvis-output{font-size:23px}
  .jband{padding:15px 18px}
  .jname{font-size:29px}
  .jb{font-size:20.5px}
  .jb .when{font-size:17.5px}
  .jbullets{gap:9px;padding-top:12px}
  .jnote{font-size:19px}

  /* loud agenda: this is the thing the display exists for.
     Everything in this block went up 4px on 2026-08-14 — readable up close is
     not the same as readable from the bed, which is where it is actually read
     from. Row padding stayed put: the type grew into the space it had. */
  /* The time column is fixed, so it has to grow with the type or "11:00am"
     runs into the event's rail. Seven mono characters at this size. */
  .row{padding:10px 4px;grid-template-columns:84px 3px 1fr}
  .row .n{font-size:24px}
  .row .s{font-size:18.5px}
  .row .t{font-size:19.5px}
  .dayh{font-size:19px;padding:18px 4px 6px}
  .hd{font-size:18px}
  /* The water buttons stay in landscape generally — landscape is also a laptop
     and a phone turned sideways, and hiding them there left no way to log a
     drink at all. They come off only on the panel itself, further down. */
    /* the list runs past the bottom of the screen; fade the last row out instead of
     slicing it in half, so the wall reads as "more below" rather than broken */
  #agList{-webkit-mask-image:linear-gradient(#000 calc(100% - 34px),transparent);
          mask-image:linear-gradient(#000 calc(100% - 34px),transparent)}
  #water .wnum{font-size:38px}
  #water .wnum u{font-size:19px}
  #water .wsub{font-size:18px}
  #water .wtrack{height:11px}
  /* JARVIS takes the slack in the column; the word card stays exactly content-sized */
  .jband{flex:1;overflow:hidden}   /* clip inside the card, never over the one below */
  #motcard{flex:0 0 auto}
  #motcard .sense{font-size:21px}
  #motcard .w{font-size:32px}
  #motcard .p{font-size:18px}
  #motcard .ex{font-size:18px}
  #motcard .lang .tag{font-size:16px}
}

/* Big walls (a 1080p TV, which is what the Pi will most likely drive). The base
   wall sizes are laptop-sized there: readable up close, small from the doorway.
   One notch up, same layout. */
@media (min-aspect-ratio:5/4) and (min-height:1000px){
  .top{padding:16px 32px}
  #clock{font-size:76px}
  .tpill{height:54px;font-size:25px}
  .gearbtn{width:54px;height:54px;font-size:25px}
  .deck{gap:20px;padding:18px 32px 24px}
  .pad{padding:19px 24px}
  .card{border-radius:20px}

  .jband{padding:19px 23px;gap:12px}
  .jname{font-size:34px}
  #jarvis-output{font-size:27px}
  .jbullets{gap:11px;padding-top:14px}
  .jb{font-size:23.5px}
  .jb .when{font-size:19px}

  .row{padding:12px 5px;grid-template-columns:94px 3px 1fr}
  .row .n{font-size:28px}
  .row .s{font-size:21px}
  .row .t{font-size:22px}
  .dayh{font-size:22px;padding:22px 5px 7px}

}

/* Below this the left column can't hold three cards: the word card wins the space
   and the briefing gets squeezed to nothing. A wall exists to show the briefing and
   the agenda, so the word is what goes. Zack's panel is well above this. */
@media (min-aspect-ratio:5/4) and (max-height:680px){
  #motcard{display:none}
}

/* ── the panel itself, and only it ───────────────────────────────────────────
   The 800x480 LCD in Zack's room has no touchscreen, so a button on it is a
   control nothing can reach. Everything else in landscape — a laptop, a phone
   held sideways — can press one, and hiding them everywhere in landscape is
   what left him with no way to log water at all.

   Two tests, because either alone is wrong. `pointer:none` is the honest one:
   no pointing device of any kind, which is exactly the kiosk. But a mouse left
   plugged into the Pi would defeat it, so the size test backs it up — 800x480
   matches, a laptop (1280x800) does not, and a phone in landscape is wider than
   820 on anything current. */
/* THE RELIABLE ONE. Both tests below infer "this is the wall" from what the
   browser reports, and on Zack's actual panel both were wrong: the cursor stayed
   and the water buttons stayed. `pointer:none` is defeated by anything X counts
   as a pointing device, and the size test only matches if the panel really
   reports 800x480 in CSS pixels, which his evidently does not.
   So the kiosk says so itself. start_jarvis.sh and the watchdog both launch
   Chromium at /?wall=1, the script below stamps html.is-wall, and that cannot be
   defeated by a resolution or a stray mouse. */
html.is-wall #water .wacts{display:none}
html.is-wall,html.is-wall body,html.is-wall *{cursor:none}
/* The two inferences stay as a fallback, for a panel reached without the flag. */
@media (pointer:none){
  #water .wacts{display:none}
  /* No pointing device means the arrow X parks on the screen is just a mark on
     the wall. Nothing can move it and nothing can click, so it is litter. */
  html,body,*{cursor:none}
}
@media (min-aspect-ratio:5/4) and (max-width:820px) and (max-height:520px){
  #water .wacts{display:none}
  html,body,*{cursor:none}
}

/* Short walls (a 720p panel, a laptop screen). The full-size type doesn't fit the
   left column there: the briefing runs past the card and the ★ bullets end up
   hidden behind the water card. Same layout, one notch down, so everything that
   matters is still on the glass. */
@media (min-aspect-ratio:5/4) and (max-height:830px){
  .top{padding:9px 22px}
  #clock{font-size:50px}
  .tpill{height:40px;font-size:20px}
  .gearbtn{width:40px;height:40px;font-size:20px}
  .deck{gap:12px;padding:12px 22px 15px}
  .pad{padding:12px 16px}

  .jband{padding:12px 15px;gap:8px}
  .jname{font-size:25px}
  #jarvis-output{font-size:20px}
  .jbullets{gap:6px;padding-top:9px}
  .jb{font-size:18.5px}
  .jb .when{font-size:16.5px}

  .row{padding:5px 4px;grid-template-columns:76px 3px 1fr}
  .row .n{font-size:21px}
  .row .s{font-size:17px}
  .row .t{font-size:17.5px}
  .dayh{font-size:17.5px;padding:9px 4px 4px}
  .hd{font-size:16.5px}

  #water .wnum{font-size:31px}
  #water .wnum u{font-size:17px}
  #water .wsub{font-size:16.5px}
  #water .wtrack{height:9px;margin-top:11px}
  #motcard .sense{font-size:18.5px;margin-top:7px}
  #motcard .pair{margin-top:11px;padding-top:11px}
  #motcard .w{font-size:27px}
  #motcard .p{font-size:16.5px}
  #motcard .ex{font-size:16.5px;margin-top:8px}
  #motcard .lang .tag{font-size:15px}
}

/* ── drawn, not typed ────────────────────────────────────────────────────
   These were the characters U+2699 GEAR and U+2605 BLACK STAR. This file used
   to note that they are "text-default codepoints that render in the UI font,
   not as colour emoji". That is true in the Pi's Chromium and FALSE on iOS,
   where U+2699 comes back as a full colour emoji. Zack asked for no emoji
   anywhere, so they are paths now and look the same on every screen. */
.ico{width:1em;height:1em;display:inline-block;vertical-align:-0.125em}
.st .ico.star,.imp .ico.star{width:.78em;height:.78em}
</style>
</head>
<body>
<div class="demo-banner" id="demoBanner">MonCoeur · live demo · synthetic data</div>
<div class="top">

<!-- Photo mode. A layer over the dashboard rather than a separate page, so the

  <!-- Homework is first because it is the reason the drawer gets opened. Adding

  <section class="sec">

  <!-- Water lives here as well as on the card. The card's buttons are portrait

  <section class="sec">

<script>
/* Stamped from the URL the kiosk was launched with, before anything renders, so
   the wall never flashes a cursor or a button it cannot use. Also honours a
   saved flag, so opening the dashboard on the panel without the query string
   still behaves as the wall once it has been told once. */
(function(){
  try{
    const q = new URLSearchParams(location.search);
    if(q.get('wall') === '1') localStorage.setItem('moncoeurWall','1');
    if(q.get('wall') === '0') localStorage.removeItem('moncoeurWall');
    if(localStorage.getItem('moncoeurWall') === '1')
      document.documentElement.classList.add('is-wall');
  }catch(e){}
})();

function tick(){
  const d=new Date();
  // just the digits: no am/pm. A wall clock you glance at doesn't need telling
  // which half of the day it is.
  const s=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  const m=s.match(/\s*([AP]\.?M\.?)$/i);   // 24-hour locales have none, and that's fine
  document.getElementById('clock').textContent=m?s.slice(0,m.index):s;
}
tick();setInterval(tick,10000);

/* ── unified agenda: events + tasks, grouped by day, skip empty days ── */
const DAY=86400000;
function d(offset,h,m){const x=new Date();x.setHours(h??23,m??59,0,0);return new Date(x.getTime()+offset*DAY)}
let ITEMS=[
 {when:d(0,9,0),   n:'ELEE 4230 lecture', s:'Driftmier 1240', kind:'ev'},
 {when:d(0,14,0),  n:'Robotics lab',      s:'Glove: single-finger test', kind:'ev', now:true},
 {when:d(0,17,40), n:'Leave for campus',  s:'MonCoeur reminder', kind:'task', done:false},
 {when:d(0,18,0),  n:'Physics PLA session', s:'Physics 203', kind:'ev'},
 {when:d(0,20,30), n:'HIST reading response', s:'Due 11:59 pm', kind:'task'},
 {when:d(2,17,0),  n:'ELEE lab report',   s:'Submit on eLC', kind:'task'},
 {when:d(3,9,30),  n:'ELEE 4230 quiz',    s:'Chapters 5 and 6', kind:'task', imp:true},
 {when:d(6,14,0),  n:'Co-op interview',   s:'Zoom', kind:'ev', imp:true},
 {when:d(2,19,0),  n:'French audio regen pass', s:'francais-familier', kind:'task'},
 {when:d(5,10,0),  n:'Theta Tau rush planning', s:'Fall PNM events', kind:'task'},
 // Computed on the Pi by compute_hair_wash_days() and folded into /api/agenda.
 // A line on a day, which is what the agenda is for — not a card of its own.
 {when:d(3,20,0),  n:'Wash hair',        s:'', kind:'task', chore:true}
];
const agL=document.getElementById('agList');
function dayLabel(dt){
  const now=new Date(); now.setHours(0,0,0,0);
  const that=new Date(dt); that.setHours(0,0,0,0);
  const diff=Math.round((that-now)/DAY);
  if(diff===0)return 'Today';
  if(diff===1)return 'Tomorrow';
  return dt.toLocaleDateString([],{weekday:'long'});
}
/* drawer */
const drw=document.getElementById('drawer'),ovl=document.getElementById('ovl');
document.getElementById('setBtn').onclick=()=>{drw.classList.add('open');ovl.classList.add('open');
  // Courses are read fresh on open. Loading them once at startup meant the
  // demo list stuck around even after the Pi answered, because the first
  // call ran before LIVE.on was ever true.
  if(typeof loadCourses==='function')loadCourses();
  if(typeof loadShop==='function')loadShop();
  if(typeof loadReps==='function')loadReps();};
document.getElementById('setClose').onclick=ovl.onclick=()=>{drw.classList.remove('open');ovl.classList.remove('open')};
document.getElementById('themeBtn2').onclick=()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark'};

/* JARVIS band: minimize out of the way once you've read it */
const jband=document.getElementById('jband'),jToggle=document.getElementById('jToggle');
jToggle.onclick=()=>{
  const collapsed=jband.classList.toggle('collapsed');
  jToggle.textContent=collapsed?'+':'−';
  jToggle.setAttribute('aria-label',collapsed?'Expand message':'Minimize message');
};

/* lights ────────────────────────────────────────────────────────────
   On/off lives on the dashboard; brightness and colour live in Settings so
   the wall stays a one-tap control. The tile carries the actual colour, so
   the panel itself reads as the lamp. In the build the POST goes to the Pi,
   which drives the bulbs over the LAN (no vendor cloud). */
const LAMPS=[
  ['Silver', '#c3cbd6'],
  ['Warm',   '#ffb765'],
  ['Neutral','#ffe4c2'],
  ['Cool',   '#cfe0ff'],
  ['Red',    '#f2685f'],
  ['Amber',  '#ffa23a'],
  ['Green',  '#5fc78f'],
  ['Blue',   '#6f9bff'],
  ['Violet', '#a684f0'],
  ['Pink',   '#ff7fb6']
];
/* bright starts at 72 and MUST be corrected by syncLights() the moment a Pi
   answers. It was a made-up number that nothing ever moved: the slider read
   72 on every page load however dim the room was, and toggling the lamp tile
   POSTed brightness:72, which the server obeys because an explicit brightness
   is a decision. That is why the lights kept coming back bright. */
let lightsOn=true, lampColor=LAMPS[0][1], bright=72;
/* When he last touched the slider, so a poll does not fight his thumb. */
let briTouched=0;
const lightsTile=document.getElementById('lightsTile');
function applyLamp(){
  // brightness dims the dot the pill glows with, so 20% actually looks like 20%
  const a=(0.35+0.65*(bright/100)).toFixed(2);
  lightsTile.style.setProperty('--lamp',lampColor);
  lightsTile.querySelector('.bulb').style.opacity=lightsOn?a:'1';
  lightsTile.classList.toggle('on',lightsOn);
  lightsTile.setAttribute('aria-pressed',lightsOn);
  lightsTile.title=lightsOn?'Lights: '+bright+'%':'Lights: off';
}

/* Actually switch the bulbs. This was a commented-out fetch to a /lights route
   that never existed, so the tile flipped its own icon and did nothing to the
   room — the Flic worked and the screen did not, which is the confusing way
   round. The real endpoint is /api/lights/control, and temperature.py's
   manualLightCommandThread acts on a CHANGED timestamp, so re-sending the state
   it is already in is harmless.

   Colour is deliberately not sent: lightCommand carries target, state and
   brightness only, and the collector's lightControl() takes no colour. The
   swatches stay a local preference until there is a channel for them. */
async function sendLights(){
  if(!LIVE.on)return;
  try{
    await api('/api/lights/control',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({target:'all',state:lightsOn,brightness:bright,
                           color:lampColor})});
  }catch(e){}
}

/* lightStatus is a sentence, not a flag: temperature.py writes "shelf on 70%",
   "Auto Dim 30%", "Off.", "Sunrise: lights off". flic_listener.py substring
   matches for exactly this reason, and this has to agree with it or the screen
   and the button disagree about what the room is doing. */
/* The room pill was hardcoded at 72.4 in the markup and nothing ever wrote to
   it, so the wall reported a made-up temperature no matter what the sensor
   said. /api/brief already carries facts.roomTemp, which app.py fills from the
   collector's sensorTemp, so the value was there the whole time and simply
   never reached the element. Returns null off the Pi so the demo keeps its own
   synthetic number. */
function roomTempLive(){
  const f=(LIVE.on&&LIVE.brief&&LIVE.brief.facts)||null;
  if(!f)return null;
  const v=Number(f.roomTemp);
  return isFinite(v)?v:null;
}
function syncRoomTemp(){
  const el=document.getElementById('tempPill'); if(!el)return;
  const v=roomTempLive(); if(v===null)return;
  el.innerHTML='<i>room</i>'+v.toFixed(1)+'\u00B0';
}

function syncLights(){
  if(!LIVE.on)return;
  const f=(LIVE.brief&&LIVE.brief.facts)||{};
  const s=String(f.lightStatus||'').toLowerCase();
  if(!s||s==='--')return;
  const on=s.indexOf('on')>=0||s.indexOf('dim')>=0;
  let dirty=false;
  if(on!==lightsOn){lightsOn=on;dirty=true}

  /* THE LEVEL, not just on or off. `bright` was initialised to 72 and nothing
     ever moved it, so the slider read 72 on every load however dim the room
     was, and toggling the lamp tile POSTed brightness:72 explicitly. That is
     why the lights came back bright even after the server learned to restore
     the real level: the dashboard was overriding it with a number it had made
     up at page load.

     Held off for a few seconds after he last touched the slider. A poll landing
     mid-adjustment would otherwise yank the handle back to where the room still
     is, and the room is behind by design: the command has to reach the bulbs
     and be reported back before the status agrees with him. */
  if(typeof f.lightLevel==='number' && (Date.now()-briTouched)>4000 && f.lightLevel!==bright){
    bright=f.lightLevel;
    briRange.value=bright;
    briVal.textContent=bright+'%';
    dirty=true;
  }
  /* Colour comes from the server's own record, because the collector reports
     none. It is still the room: nothing but this app ever sets it. */
  if(f.lightColor && f.lightColor!==lampColor){
    lampColor=f.lightColor;
    markSwatch();
    dirty=true;
  }
  if(dirty)applyLamp();
}
function bindToggle(el,fn){
  el.addEventListener('click',fn);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
}
bindToggle(lightsTile,()=>{lightsOn=!lightsOn;applyLamp();sendLights()});

const sw=document.getElementById('swatches');
/* Which swatch is selected, from lampColor. Needed because the colour can now
   change from the server as well as from a tap here, and a selection that only
   ever moved on tap would show the wrong one after a sync. */
function markSwatch(){
  [...sw.children].forEach(c=>
    c.classList.toggle('sel', c.dataset.hex===lampColor));
}
LAMPS.forEach(([name,hex])=>{
  const b=document.createElement('span');
  b.className='sw'+(hex===lampColor?' sel':'');
  b.style.background=hex;b.title=name;b.dataset.hex=hex;
  // sendLights() is the part that was missing: picking a swatch changed the
  // pill's glow and nothing in the room, because nothing was ever sent.
  b.onclick=()=>{lampColor=hex;lightsOn=true;markSwatch();applyLamp();sendLights()};
  sw.appendChild(b);
});

briRange.addEventListener('input',()=>{briTouched=Date.now();bright=+briRange.value;

   Presence comes from Bluetooth: the Pi scans for your phone, so in range =

   until it matters, then JARVIS takes the top line and ntfy pushes your phone.
   The two buttons in Settings > Demo stand in for the sensors here. */

  if(ab)ab.textContent='Away: '+(away?'on':'off');
  jarvisRender();
}
/* Presence comes from presence_ble.py on the Pi — your phone's Bluetooth, with
   the pairing key resolving the address iOS rotates every ~15 minutes. Here the
   Demo toggle stands in for it. */

/* Freshness. The backend already knows (is_fresh) and already pushes when the
   collector goes quiet; this is the half that was missing — saying so on the
   screen, so a number you can see is a number you can trust. */
let stale=false;
function paintStale(){
  // The "hide the readings" half already existed via [data-stale="1"]; the
  // marker is the half that was missing. Hiding alone leaves a gap you might
  // read as "nothing to report" rather than "I have lost the sensor".
  // Stale is a push, not a panel. On screen it only removes the readings —
  // saying nothing beats saying yesterday's number with confidence — and the
  // explanation arrives on his phone from nudge_dead_sensor.
  document.documentElement.dataset.stale = stale ? '1' : '0';
}
function setStale(v){stale=v;paintStale();const b=document.getElementById('staleBtn');
  if(b)b.textContent='Data: '+(stale?'stale':'fresh')}

/* A task typed into a ghost row, sent to the Pi. Optimistic: it shows up at
   once and the next pull replaces it with the server's copy. */
async function saveTask(it){
  const iso=new Date(it.when.getTime()-it.when.getTimezoneOffset()*6e4)
    .toISOString();
  ITEMS.push(it);                     // show it immediately
  try{
    await api('/api/todos',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:it.n,type:'task',
        due_date:iso.slice(0,10),
        due_time:it.when.getHours()===23&&it.when.getMinutes()===59?null:iso.slice(11,16)})});
    clearTimeout(LIVE.timer);pull();
  }catch(e){/* keep the local copy; the next pull will correct it */}
}

/* ── photo mode ───────────────────────────────────────────────────────────
   The album comes from /api/photos on the Pi. Order is a no-repeat bag rather
   than Math.random: true random repeats, and a wall that shows the same photo
   twice in a row looks broken even though it is behaving.

   Only the next image is preloaded and only two are ever in the DOM. A Pi
   decoding more than that stutters, and a stutter on a wall is the whole
   feature failing. */
const PHOTO_DWELL_MS=30000;
const PHOTOS={list:[],bag:[],i:0,slide:0,timer:null,on:false,pre:false};

function photoBag(){
  const b=PHOTOS.list.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}
  return b;
}
function photoNext(){
  if(!PHOTOS.list.length)return null;
  if(!PHOTOS.bag.length)PHOTOS.bag=photoBag();
  return PHOTOS.bag.pop();
}
/* The blurred backdrop is a separate, tiny file the Pi renders once per photo.
   It only exists when Pillow is installed; PHOTOS.pre says whether to ask for
   it, and the .pre class on the layer is what switches the CSS filter off. */
function photoBackdrop(u){return PHOTOS.pre&&/^\/photo\//.test(u)?u+'/blur':u}

/* cover or contain, decided per photo.

   The wall is 800x480, so almost nothing matches it exactly and `contain` alone
   left every picture floating in bars — a 4:3 shot filled 640 of 800 px, a
   portrait one 360. `cover` alone is worse: it would crop a portrait photo down
   to a horizontal slice and take someone's head off.

   So: how far is this photo's shape from the screen's? Within about a third,
   cover it — the crop is small and the picture fills the glass. Beyond that,
   contain it and let the blurred backdrop hold the bars, which is what the
   backdrop was built for. On a 5:3 wall that means landscape photos fill and
   portrait photos letterbox, which is the right answer for both. */
/* Aspect ratios, learned once per photo and kept, so pairing does not have to
   download an image twice to find out which way up it is. */
const PHOTO_RATIO = {};
const PORTRAIT_MAX = 0.92;          // w/h below this is "upright"

function loadPhoto(url){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      if(img.naturalHeight)PHOTO_RATIO[url]=img.naturalWidth/img.naturalHeight;
      resolve(true);
    };
    img.onerror=()=>resolve(false);
    img.src=url;
  });
}
const isPortrait=u=>PHOTO_RATIO[u]!==undefined&&PHOTO_RATIO[u]<PORTRAIT_MAX;

/* Pull the next photo, and a second one when the first turns out to be upright
   and there is another upright waiting. Returns the urls to put on screen.

   Pairing only happens when the partner is ALREADY known to be a portrait, from
   having been shown before. A cold album shows them one at a time for the first
   pass and pairs from then on, which is the right trade: guessing would mean
   downloading photos just to measure them, on a Pi, over wifi. */
async function photoNextSet(){
  const first=photoNext();
  if(!first)return [];
  if(!await loadPhoto(first))return null;          // gone; caller retries
  if(!isPortrait(first))return [first];

  const idx=PHOTOS.bag.findIndex(u=>isPortrait(u));
  if(idx<0)return [first];
  const second=PHOTOS.bag.splice(idx,1)[0];
  if(!await loadPhoto(second))return [first];
  return [first, second];
}

async function photoShow(tries){
  const layer=document.getElementById('photoLayer');
  const set=await photoNextSet();

  if(set===null){                       // the photo 404'd; drop it and move on
    if((tries||0)<4)return photoShow((tries||0)+1);
    return;
  }
  if(!set.length){
    layer.querySelectorAll('.pslide').forEach(e=>e.classList.remove('show'));
    if(!layer.querySelector('.pempty')){
      const e=document.createElement('div');e.className='pempty';
      e.textContent='no photos yet';layer.appendChild(e);
    }
    layer.classList.add('on');
    return;
  }

  const gone=layer.querySelector('.pempty');if(gone)gone.remove();
  const slides=layer.querySelectorAll('.pslide');
  const next=slides[PHOTOS.slide%2], prev=slides[(PHOTOS.slide+1)%2];
  const grid=next.querySelector('.pgrid');

  // The backdrop takes the first photo. With two portraits it is barely visible
  // behind them anyway, and picking one keeps it to a single decode.
  next.style.setProperty('--blur','url("'+photoBackdrop(set[0])+'")');
  layer.classList.toggle('pre',!!PHOTOS.pre);

  grid.classList.toggle('solo',set.length===1&&!isPortrait(set[0]));
  grid.innerHTML='';
  set.forEach(u=>{
    const d=document.createElement('div');
    d.className='pimg';
    d.style.backgroundImage='url("'+u+'")';
    grid.appendChild(d);
  });

  // restart the drift from scratch for the incoming slide
  next.classList.remove('show');void next.offsetWidth;
  next.classList.add('show');
  prev.classList.remove('show');
  PHOTOS.slide++;
  // Only reveal the layer once there is something on it. Fading in first meant a
  // black screen for however long the first photo took to decode, which on a Pi
  // is long enough to look like a fault.
  layer.classList.add('on');
}
function photoStart(){
  if(PHOTOS.on)return;
  PHOTOS.on=true;
  photoShow();          // the layer reveals itself once the first image lands
  clearInterval(PHOTOS.timer);
  PHOTOS.timer=setInterval(photoShow,PHOTO_DWELL_MS);
}
function photoStop(){
  PHOTOS.on=false;
  clearInterval(PHOTOS.timer);PHOTOS.timer=null;
  const l=document.getElementById('photoLayer');
  l.classList.remove('on');
  l.querySelectorAll('.pslide').forEach(e=>e.classList.remove('show'));
}
async function loadPhotos(){
  if(LIVE.on){
    try{
      const r=await api('/api/photos');
      PHOTOS.pre=!!r.pillow;
      const next=(r.photos||[]).map(p=>'/photo/'+p.id);
      /* Only disturb the bag when the album actually changed. applyLive() calls
         through to here on every poll and every SSE change, and this used to
         empty the bag unconditionally — every 20s, faster than the 30s dwell.
         So the bag was always freshly shuffled when photoNext() ran, every pick
         was an independent draw, and the no-repeat guarantee this was all built
         for never once held on a real Pi. It held on the demo, where nothing
         polls. Surviving entries are kept on a change so no-repeat also
         survives an add or a delete. */
      if(next.join('\n')!==PHOTOS.list.join('\n')){
        PHOTOS.list=next;
        PHOTOS.bag=PHOTOS.bag.filter(u=>next.indexOf(u)>=0);
      }
      return;
    }catch(e){}
  }
  // No Pi: stand-ins so the mode can be looked at on the portfolio demo.
  if(!PHOTOS.list.length){
    const g=[['#25405e','#7d93b4'],['#4a3550','#b39ac0'],['#2b4a44','#8fb8ac'],
             ['#5a4430','#c4a882'],['#33405e','#9aa8cc']];
    PHOTOS.list=g.map(([a,b])=>
      'data:image/svg+xml;utf8,'+encodeURIComponent(
        `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
         <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
         <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/>
         </linearGradient></defs><rect width="1200" height="800" fill="url(#g)"/>
         <circle cx="600" cy="400" r="180" fill="${b}" opacity=".45"/></svg>`));
    PHOTOS.bag=[];
  }
}

/* The wall's mode lives on the server so the Flic can change it. Nothing read
   it before, which is why the hold press had no visible effect. */
/* Photo mode belongs to the WALL, and only the wall.

   Wall mode is one global sticky value on purpose: the Flic's hold sets it and
   the phone is the fallback control, so any device may TOGGLE it. What was
   wrong is that any device also OBEYED it, so holding the button turned Zack's
   phone into a photo frame as well. The 800x480 panel is the thing in the room
   showing photos; a phone in your hand is what you toggle it with.

   The size and pointer inferences are not consulted here. This is the same
   html.is-wall flag the kiosk stamps from /?wall=1, because both inferences
   were wrong on his actual panel. A laptop held sideways is not the wall. */
function isWallScreen(){
  return document.documentElement.classList.contains('is-wall');
}

/* Is THIS device the thing that shows the photos?

   The wall, obviously. And also the portfolio demo, where there is no Pi and no
   wall, so the page in front of you has to stand in for one or the demo loses
   the feature entirely. What is excluded is the case that was wrong: a phone
   talking to a real Pi, where the wall is a different screen in the room. */
function photoSurface(){
  return isWallScreen() || !LIVE.on;
}

function applyWallMode(mode){
  const onPhotos = (mode === 'photos');
  if(onPhotos && photoSurface()){loadPhotos().then(photoStart)}
  else photoStop();
  /* Feedback, so the toggle is not silent on the device doing the toggling.
     Without this, pressing "Show photos" on the phone looks like nothing
     happened, which reads as broken rather than as remote. */
  const b = document.getElementById('photoBtn');
  if(b && !photoSurface()) b.textContent = onPhotos ? 'Wall is showing photos' : 'Show photos';
}

/* repeating rules -> materialize into agenda days */
let REPS=[{n:'Gym',kind:'ev',freq:'daily',time:'11:30'},{n:'Water the plant',kind:'task',freq:'3',time:'20:00'}];
function repItems(){
  if(LIVE.on)return [];   // server-side expansion owns this when the Pi answers
  const out=[];const base=new Date();base.setHours(0,0,0,0);
  for(let o=0;o<14;o++){
    const day=new Date(base.getTime()+o*DAY);
    REPS.forEach(r=>{
      if(r.freq==='daily'||+r.freq===day.getDay()){
        const [H,M]=r.time.split(':');const w=new Date(day);w.setHours(+H,+M,0,0);
        if(w>new Date()-3600000)out.push({when:w,n:r.n,s:r.freq==='daily'?'daily':'weekly',kind:r.kind,done:false,rep:true});
      }
    });
  }
  return out;
}
const repList=document.getElementById('repList');
const DAYNAME=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const repLabel=r=>r.freq==='daily'?'daily':'every '+(DAYNAME[+r.freq]||'week');

function rReps(){
  repList.innerHTML='';
  REPS.forEach((r,i)=>{
    const d=document.createElement('div');d.className='cd';
    d.innerHTML=`<span class="n">${r.n}</span><span class="d" style="font-size:12px">${repLabel(r)} · ${r.time}</span>`;
    d.onclick=()=>removeRep(r,i);
    repList.appendChild(d);
  });
}

/* Rules were a local array, so every one was lost on reload and the Pi never
   saw them. On the server a rule is just a todo with a repeat field, which
   build_agenda expands — "daily", "weekdays", or "weekly:N" for a named day. */
async function loadReps(){
  if(!LIVE.on)return;
  try{
    const todos=await api('/api/todos');
    REPS=todos.filter(t=>t.repeat).map(t=>({
      id:t.id,n:t.name,kind:t.type==='ev'?'ev':'task',
      freq:t.repeat==='daily'?'daily':String((t.repeat.split(':')[1]??'')||'daily'),
      time:t.due_time||'18:00'}));
    rReps();
  }catch(e){}
}
/* Auto photos. The server owns this so the wall and the phone can never
   disagree about it, and so it survives a restart. "Only when I ask" is off,
   which is the shipped default: a screen you cannot touch should not start
   changing itself until he has said he wants that. */
async function loadWallAuto(){
  if(!LIVE.on)return;
  try{
    const c=await api('/api/wall/auto');
    document.getElementById('waAfter').value=c.enabled?String(c.afterMin):'0';
    document.getElementById('waReturn').value=c.returnOnMotion?'1':'0';
  }catch(e){}
}
async function saveWallAuto(){
  if(!LIVE.on)return;
  const after=parseInt(document.getElementById('waAfter').value,10)||0;
  try{
    await api('/api/wall/auto',{method:'POST',
      headers:{'Content-Type':'application/json'},
      // afterMin is only sent when it is a real delay: 0 means off, and the
      // server clamps to at least 1, so posting 0 would silently become 1 and
      // the drawer would come back saying "after 1 minute still".
      body:JSON.stringify(Object.assign({enabled:after>0,
        returnOnMotion:document.getElementById('waReturn').value==='1'},
        after>0?{afterMin:after}:{}))});
    clearTimeout(LIVE.timer);pull();
  }catch(e){}
}
async function addRep(rule){
  if(LIVE.on){
    try{
      await api('/api/todos',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:rule.n,type:rule.kind==='ev'?'ev':'task',
          due_time:rule.time,
          repeat:rule.freq==='daily'?'daily':'weekly:'+rule.freq})});
      await loadReps();clearTimeout(LIVE.timer);pull();
      return;
    }catch(e){}
  }
  REPS.push(rule);rReps();render();
}
async function removeRep(r,i){
  REPS.splice(i,1);rReps();render();
  if(LIVE.on&&r.id!=null){
    try{await api('/api/todos/'+r.id,{method:'DELETE'});clearTimeout(LIVE.timer);pull()}catch(e){}
  }
}
